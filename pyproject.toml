[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "golded-ftn"
version = "1.2.0"
description = "Shared FTN message contracts, values and text helpers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GoldED.dev contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Typing :: Typed", "Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/golded-dev/golded-ftn-python"
Issues = "https://github.com/golded-dev/golded-ftn-python/issues"
Changelog = "https://github.com/golded-dev/golded-ftn-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "twine>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/golded_ftn"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
